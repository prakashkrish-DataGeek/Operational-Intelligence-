[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasauti"
version = "0.1.0"
description = "A touchstone benchmark for operational AI on real Volve field data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Prakash Krishnamachari" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "openpyxl>=3.1",
  "lasio>=0.31",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
app = ["streamlit>=1.30"]

[project.scripts]
kasauti = "kasauti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["volve: needs the real Volve files in data/raw"]
